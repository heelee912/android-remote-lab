name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-and-skill:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run check
      - run: npm test
      - run: npm run validate-powershell
      - run: npm run validate-skill
      - name: Rebuild windowless launcher
        shell: pwsh
        run: |
          $csc=(Get-ChildItem "$env:WINDIR\Microsoft.NET\Framework64" -Recurse -Filter csc.exe | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $csc /nologo /target:winexe /optimize+ /out:windows/CompanionRelayLauncher.ci.exe windows/CompanionRelayLauncher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Lint and build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintRelease assembleDebug

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
